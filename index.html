<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Daily Focus Product</title>
<style>
  /* ===== iPhone 18 Pro "Glacier" theme: ice blue, frosted glass, deep steel-blue ink ===== */
  :root{
    --ice-0:#f4f9fc; --ice-1:#e6f1f8; --ice-2:#d3e6f2; --ice-3:#b9d6ea; --ice-4:#8fbadb;
    --glacier:#6fa3cc; --glacier-deep:#3f78a6; --steel:#24506f; --ink:#152b3c; --muted:#5d7488;
    --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88); --edge:rgba(255,255,255,.95);
    --line:rgba(63,120,166,.14); --shadow:0 10px 34px rgba(36,80,111,.13);
    --lvl0:#d6e8f4; --lvl1:#e9f3f9; --hi:#e2f0fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 85% -10%,#ffffff 0%,rgba(255,255,255,0) 60%),
               linear-gradient(160deg,#f2f8fc 0%,#e1eef7 38%,#cfe3f1 72%,#bcd7ea 100%) fixed;}
  #shotArea{min-height:100vh;display:flex;flex-direction:column;background:inherit}
  header{position:sticky;top:0;z-index:20;padding:14px 24px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;
    background:rgba(244,249,252,.78);backdrop-filter:saturate(170%) blur(18px);-webkit-backdrop-filter:saturate(170%) blur(18px);
    border-bottom:1px solid var(--edge);box-shadow:0 1px 0 var(--line)}
  .stamp{display:flex;gap:10px}
  .stamp div{background:var(--glass-strong);border:1px solid var(--edge);border-radius:14px;padding:6px 14px;box-shadow:0 2px 10px rgba(36,80,111,.07)}
  .stamp b{display:block;font-size:23px;letter-spacing:-.2px;color:var(--steel);font-weight:700}
  .stamp span{color:var(--muted);font-size:12.5px;letter-spacing:.2px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:4px;background:rgba(255,255,255,.55);border:1px solid var(--edge);border-radius:999px}
  .tabs button{border:0;background:transparent;color:var(--steel);padding:9px 17px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;border-radius:999px;letter-spacing:.2px}
  .tabs button:hover{background:rgba(255,255,255,.8)}
  .tabs button.on{background:linear-gradient(135deg,#8fc1e3 0%,#5f97c4 55%,#3f78a6 100%);color:#fff;box-shadow:0 4px 14px rgba(63,120,166,.35)}
  h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.4px;flex:1;min-width:230px;
    background:linear-gradient(90deg,#24506f,#5f97c4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{font-size:12.5px;color:var(--muted);background:var(--glass-strong);border:1px solid var(--edge);border-radius:999px;padding:4px 11px}
  .btn{font-weight:600;font-size:14px;font-family:inherit;border:1px solid var(--edge);background:var(--glass-strong);color:var(--steel);padding:8px 14px;border-radius:10px;
    text-decoration:none;cursor:pointer;box-shadow:0 1px 4px rgba(36,80,111,.08);white-space:nowrap}
  .btn:hover{background:#fff;border-color:var(--ice-3)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.pri{background:linear-gradient(135deg,#7fb4da,#3f78a6);color:#fff;border-color:transparent}
  main{flex:1;width:100%;padding:18px 24px 30px}
  .card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:20px;
    padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 14px;font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--steel)}
  .card h2 small{font-weight:500;color:var(--muted);font-size:14px}
  .scroll{overflow-x:auto;overflow-y:visible;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6)}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  th{white-space:normal;line-height:1.25;vertical-align:bottom}
  td.name,td.l{overflow:hidden;text-overflow:ellipsis}
  th,td{padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:static;background:linear-gradient(180deg,#eaf4fa,#dcecf6);color:var(--steel);font-weight:650;text-align:right;
    border-bottom:1px solid var(--ice-3);cursor:pointer;user-select:none;font-size:14px}
  th.l,td.l{text-align:left}
  td{text-align:right;font-variant-numeric:tabular-nums}
  th.tot,td.tot{border-right:2px solid var(--ice-3);font-weight:700}
  th.tot{color:var(--glacier-deep)}
  tr.r5 td{background:var(--hi);font-weight:600}
  tr.r5 td:first-child{box-shadow:inset 3px 0 0 var(--glacier)}
  tr.grand td,tfoot td{font-weight:800;background:linear-gradient(180deg,#e3f0f8,#d4e7f3);color:var(--steel);border-top:1px solid var(--ice-3)}
  td.zero{color:#b0c2d0}
  th .arr{font-size:11px;color:var(--glacier)}
  /* hierarchy rows (Summit style) */
  tr.g0 td{background:var(--lvl0);font-weight:750;color:var(--steel)}
  tr.g1 td{background:var(--lvl1);font-weight:620}
  tr.g0,tr.g1{cursor:pointer}
  tr.g0:hover td,tr.g1:hover td{filter:brightness(.98)}
  tr.st:hover td{background:#f3f9fd}
  .caret{display:inline-block;width:17px;color:var(--glacier-deep);font-size:12px}
  .lvl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-right:7px}
  .site{color:var(--muted);font-size:13px;margin-right:7px;font-weight:500}
  .cnt{color:var(--muted);font-weight:500}
  /* controls */
  .filters,.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  .filters label,.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:5px;font-weight:650;text-transform:uppercase;letter-spacing:.4px}
  select,input[type=search]{font-size:15px;font-family:inherit;padding:7px 10px;border:1px solid var(--edge);border-radius:10px;min-width:190px;background:var(--glass-strong);color:var(--ink);
    box-shadow:inset 0 1px 2px rgba(36,80,111,.06)}
  select:focus,input:focus{outline:2px solid var(--ice-4);outline-offset:1px}
  .filters .chk{flex-direction:row;align-items:center;text-transform:none;font-weight:550;font-size:14px;color:var(--ink);letter-spacing:0;gap:6px}
  .chk input{accent-color:var(--glacier-deep);width:15px;height:15px}
  .seg{display:inline-flex;background:rgba(255,255,255,.6);border:1px solid var(--edge);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit;color:var(--steel);cursor:pointer}
  .seg button[aria-pressed=true]{background:linear-gradient(135deg,#8fc1e3,#3f78a6);color:#fff}
  .lvlbtns{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);font-weight:600}
  .grow{flex:1}
  .msg{padding:40px;text-align:center;color:var(--muted)}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(21,43,60,.92);color:#fff;padding:9px 16px;border-radius:12px;display:none;z-index:50;font-size:12px}
  @media (max-width:760px){body{font-size:14px}header{padding:10px 12px}main{padding:12px}h1{font-size:17px}.stamp b{font-size:18px}}
</style>
</head>
<body>
<div id="shotArea">
<header>
  <div class="stamp">
    <div><b id="lastDate">-</b><span>Last Update</span></div>
    <div><b id="lastTime">-</b><span>Last Time</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <h1 id="title">REPORT DAILY FOCUS PRODUCT</h1>
  <div class="tools" id="tools"></div>
</header>
<main id="main"><div class="msg">Loading…</div></main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/engine.js"></script>
<script>
"use strict";
let DATA, CONFIG, TAB, VALS, BRANDS = [], isDraft = false;
const state = { brand: "", lob: "", tsh: "", site: "", q: "", zero: false, sortCol: -1, lvl: 1, open: new Set() };

(async function init() {
  try {
    const [raw, cfg] = await Promise.all([fetchJSON("data/daily.json"), loadConfig()]);
    DATA = parseData(raw);
    const d = new URLSearchParams(location.search).has("draft") ? draftConfig() : null;
    CONFIG = d || cfg; isDraft = !!d;
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="msg">Could not load data: ${esc(e.message)}<br>Run <b>Refresh data</b> once (GitHub Actions).</div>`;
    return;
  }
  document.getElementById("title").textContent = CONFIG.title || "REPORT DAILY FOCUS PRODUCT";
  document.getElementById("lastDate").textContent = fmtDate(DATA.raw.data_date);
  document.getElementById("lastTime").textContent = DATA.raw.last_time || "-";
  document.getElementById("tools").innerHTML =
    (isDraft ? `<span class="chip" style="background:#fff3c4;color:#7a5b00" data-noshot>Draft config preview</span>` : "") +
    `<span class="chip" title="When BigQuery was last queried">Imported ${esc((DATA.raw.refreshed_at || "").slice(0,16))} WIB</span>
     <button class="btn pri" id="shotSave" data-noshot title="Save the dashboard, as currently filtered, as a PNG">📷 Save PNG</button>
     <button class="btn" id="shotCopy" data-noshot title="Copy the image to paste into WhatsApp / email">Copy image</button>
     <button class="btn" id="fsBtn" data-noshot title="Full screen (Esc to exit)">⛶ Full screen</button>
     <a class="btn" data-noshot target="_blank" rel="noopener" href="https://github.com/${GITHUB_REPO}/actions/workflows/refresh.yml">Refresh data ↗</a>
     <a class="btn" data-noshot href="admin.html">Edit columns</a>`;
  document.getElementById("shotSave").onclick = () => takeShot("save");
  document.getElementById("shotCopy").onclick = () => takeShot("copy");
  const fsBtn = document.getElementById("fsBtn");
  fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => toast("Full screen is blocked by this browser - press F11"));
  document.addEventListener("fullscreenchange", () => fsBtn.textContent = document.fullscreenElement ? "✕ Exit full screen" : "⛶ Full screen");
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CONFIG.tabs.map(t => `<button data-id="${esc(t.id)}">${esc(t.name)}</button>`).join("");
  tabsEl.onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.id; };
  window.addEventListener("hashchange", selectTab);
  selectTab();
})();

function selectTab() {
  const id = decodeURIComponent(location.hash.slice(1));
  TAB = CONFIG.tabs.find(t => t.id === id) || CONFIG.tabs[0];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === TAB.id));
  BRANDS = TAB.brand_filter ? tabBrands(DATA, CONFIG, TAB) : [];
  state.brand = ""; state.sortCol = -1;
  recompute(); setLevel(state.lvl); render();
}
function recompute() { VALS = computeTab(DATA, CONFIG, TAB, { brand: state.brand }); }

// Proportional widths: label block 34% of the width (Region 5: 28% name + 6% Stores), every number column equal.
// min-width keeps numbers readable on small screens (table scrolls sideways instead).
const NAME_PCT = 34, STORES_PCT = 6;
function colgroup(n, withStores) {
  const each = (100 - NAME_PCT) / n;
  const lead = withStores ? `<col style="width:${NAME_PCT - STORES_PCT}%"><col style="width:${STORES_PCT}%">` : `<col style="width:${NAME_PCT}%">`;
  return `<colgroup>${lead}${`<col style="width:${each}%">`.repeat(n)}</colgroup>`;
}
const tableMin = n => `min-width:${420 + n * 100}px`;
const sumInto = (acc, v) => { for (let i = 0; i < acc.length; i++) acc[i] += v[i]; };
const nonzero = v => v && v.some(x => x);

// ----- Region 5 store list after filters -----
function r5Stores() {
  return [...DATA.stores.values()].filter(s => s.region === "REGION 5" &&
    (nonzero(VALS.get(s.site)) || (state.zero && zeroSalesStore(CONFIG, s))));
}
const L_ = s => s.lob || "(no LOB)", T_ = s => s.tsh || "(no TSH)";

// "Show down to": 0 = LOB, 1 = TSH, 2 = Store (Summit style)
function setLevel(l) {
  state.lvl = l; state.open.clear();
  if (l === 0 || !VALS) return;
  for (const s of r5Stores()) { state.open.add(L_(s)); if (l >= 2) state.open.add(L_(s) + "|" + T_(s)); }
}

function render() {
  const n = TAB.columns.length;
  const brandTxt = state.brand ? ` · brand ${esc(state.brand)}` : "";
  const cells = (v, extra = "") => TAB.columns.map((c, i) => `<td class="${c.total ? "tot" : ""}${v[i] ? "" : " zero"}${extra}">${v[i] ? fmt(v[i]) : "–"}</td>`).join("");

  // ---------- Brand filter ----------
  const brandBar = TAB.brand_filter ? `
    <div class="card" style="padding:12px 18px"><div class="bar" style="margin:0">
      <label>Brand<select id="fBrand"><option value="">All brands</option>${BRANDS.map(b => `<option${b === state.brand ? " selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
      <span class="note" style="margin:0 0 8px">Filters both tables below.</span></div></div>` : "";

  // ---------- Sales all region ----------
  const byRegion = new Map();
  for (const [site, v] of VALS) {
    if (!nonzero(v)) continue;
    const r = DATA.stores.get(site).region;
    if (!byRegion.has(r)) byRegion.set(r, new Float64Array(n));
    sumInto(byRegion.get(r), v);
  }
  const regions = [...byRegion.keys()].sort((a, b) => regionRank(a) - regionRank(b) || a.localeCompare(b));
  const gt = new Float64Array(n); regions.forEach(r => sumInto(gt, byRegion.get(r)));
  const head = TAB.columns.map(c => `<th class="${c.total ? "tot" : ""}">${esc(c.label)}</th>`).join("");
  const regionHTML = `
    <div class="card"><h2>Sales all region <small>${esc(TAB.name)}${brandTxt} · qty sold today</small></h2>
    <div class="scroll"><table style="${tableMin(n)}">${colgroup(n, false)}
      <thead><tr><th class="l">Region</th>${head}</tr></thead>
      <tbody>${regions.map(r => `<tr class="${r === "REGION 5" ? "r5" : ""}"><td class="l">${esc(r)}</td>${cells(byRegion.get(r))}</tr>`).join("")
        || `<tr><td class="l" colspan="${n + 1}">No sales yet today.</td></tr>`}
        <tr class="grand"><td class="l">Total</td>${cells(gt)}</tr></tbody>
    </table></div></div>`;

  // ---------- Region 5: LOB -> TSH -> Store ----------
  const all = r5Stores();
  const lobs = [...new Set(all.map(L_))].sort();
  if (state.lob && !lobs.includes(state.lob)) state.lob = "";
  const a1 = all.filter(s => !state.lob || L_(s) === state.lob);
  const tshs = [...new Set(a1.map(T_))].sort();
  if (state.tsh && !tshs.includes(state.tsh)) state.tsh = "";
  const a2 = a1.filter(s => !state.tsh || T_(s) === state.tsh);
  const sites = [...a2].sort((a, b) => a.desc.localeCompare(b.desc));
  if (state.site && !sites.some(s => s.site === state.site)) state.site = "";
  const q = state.q.trim().toUpperCase();
  const shown = a2.filter(s => (!state.site || s.site === state.site) && (!q || s.desc.toUpperCase().includes(q) || s.site.toUpperCase().includes(q)));
  if (state.site || q) shown.forEach(s => { state.open.add(L_(s)); state.open.add(L_(s) + "|" + T_(s)); });

  const zeroV = new Float64Array(n), val = s => VALS.get(s.site) || zeroV;
  const sc = state.sortCol;
  const order = (arr, nameOf, vecOf) => arr.sort(sc >= 0 ? (a, b) => vecOf(b)[sc] - vecOf(a)[sc] || nameOf(a).localeCompare(nameOf(b)) : (a, b) => nameOf(a).localeCompare(nameOf(b)));
  const tree = new Map();
  for (const s of shown) {
    if (!tree.has(L_(s))) tree.set(L_(s), new Map());
    const t = tree.get(L_(s)); if (!t.has(T_(s))) t.set(T_(s), []); t.get(T_(s)).push(s);
  }
  const tot = list => { const v = new Float64Array(n); list.forEach(s => sumInto(v, val(s))); return v; };
  let rows = ""; const grand = tot(shown);
  const lobE = order([...tree].map(([L, tm]) => { const ss = [...tm.values()].flat(); return { L, tm, ss, v: tot(ss) }; }), o => o.L, o => o.v);
  for (const o of lobE) {
    const open = state.open.has(o.L);
    rows += `<tr class="g0" data-key="${esc(o.L)}"><td class="l name" style="padding-left:12px"><span class="caret">${open ? "▼" : "▶"}</span><span class="lvl">LOB</span>${esc(o.L)}</td><td class="cnt">${o.ss.length}</td>${cells(o.v)}</tr>`;
    if (!open) continue;
    const tshE = order([...o.tm].map(([T, ss]) => ({ T, ss, v: tot(ss) })), x => x.T, x => x.v);
    for (const t of tshE) {
      const k = o.L + "|" + t.T, topen = state.open.has(k);
      rows += `<tr class="g1" data-key="${esc(k)}"><td class="l name" style="padding-left:30px"><span class="caret">${topen ? "▼" : "▶"}</span><span class="lvl">TSH</span>${esc(t.T)}</td><td class="cnt">${t.ss.length}</td>${cells(t.v)}</tr>`;
      if (!topen) continue;
      for (const s of order([...t.ss], s => s.desc, val))
        rows += `<tr class="st"><td class="l name" style="padding-left:62px" title="${esc(s.site)} · ${esc(s.desc)}"><span class="site">${esc(s.site)}</span>${esc(s.desc)}</td><td></td>${cells(val(s))}</tr>`;
    }
  }

  const opt = (vals, cur) => `<option value="">All</option>` + vals.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  const siteOpt = `<option value="">All (${sites.length})</option>` + sites.map(s => `<option value="${esc(s.site)}"${s.site === state.site ? " selected" : ""}>${esc(s.site)} · ${esc(s.desc)}</option>`).join("");
  const head5 = TAB.columns.map((c, i) => `<th class="${c.total ? "tot" : ""}" data-sort="${i}" title="Sort by ${esc(c.label)} (high to low)">${esc(c.label)} <span class="arr">${sc === i ? "▼" : ""}</span></th>`).join("");
  const lvlBtn = (l, t) => `<button type="button" data-lvl="${l}" aria-pressed="${state.lvl === l}">${t}</button>`;
  const r5HTML = `
    <div class="card"><h2>Region 5 · LOB → TSH → Store <small>${esc(TAB.name)}${brandTxt} · ${shown.length} stores</small></h2>
      <div class="filters">
        <label>LOB<select id="fLob">${opt(lobs, state.lob)}</select></label>
        <label>TSH<select id="fTsh">${opt(tshs, state.tsh)}</select></label>
        <label>Site desc<select id="fSite" style="min-width:260px">${siteOpt}</select></label>
        <label>Search store<input type="search" id="fQ" placeholder="name or site code" value="${esc(state.q)}"></label>
        <label class="chk"><input type="checkbox" id="fZero"${state.zero ? " checked" : ""}>Show active stores with no sales</label>
        <span class="grow"></span>
        <span class="lvlbtns" data-noshot>Show down to <span class="seg">${lvlBtn(0, "LOB")}${lvlBtn(1, "TSH")}${lvlBtn(2, "Store")}</span></span>
        <button class="btn" id="fReset" data-noshot>Reset</button>
        <button class="btn" id="fCsv" data-noshot>Download CSV</button>
      </div>
      <div class="scroll" id="r5scroll"><table id="t5" style="${tableMin(n)}">${colgroup(n, true)}
        <thead><tr><th class="l" data-sort="-1" title="Sort by name">LOB / TSH / Store</th><th data-sort="-1">Stores</th>${head5}</tr></thead>
        <tbody>${rows || `<tr><td class="l" colspan="${n + 2}">No Region 5 sales for this selection.</td></tr>`}</tbody>
        <tfoot><tr><td class="l">Total Region 5</td><td>${shown.length}</td>${cells(grand)}</tr></tfoot>
      </table></div>
      <div class="note" data-noshot>Qty = PAID, ${esc(describeDefault())}. Click a LOB or TSH row to open or close it, or use <b>Show down to</b>. Click a column header to sort high to low (click again for A–Z).</div>
    </div>`;

  const keep = document.getElementById("r5scroll"), st = keep ? keep.scrollTop : 0;
  document.getElementById("main").innerHTML = brandBar + regionHTML + r5HTML;
  if (keep) document.getElementById("r5scroll").scrollTop = st;
  const $ = id => document.getElementById(id);
  if ($("fBrand")) $("fBrand").onchange = e => { state.brand = e.target.value; recompute(); setLevel(state.lvl); render(); };
  $("fLob").onchange = e => { state.lob = e.target.value; state.tsh = ""; state.site = ""; render(); };
  $("fTsh").onchange = e => { state.tsh = e.target.value; state.site = ""; if (state.tsh) setLevel(Math.max(state.lvl, 2)); render(); };
  $("fSite").onchange = e => { state.site = e.target.value; render(); };
  $("fQ").oninput = e => { state.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { render(); const el = $("fQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  $("fZero").onchange = e => { state.zero = e.target.checked; setLevel(state.lvl); render(); };
  $("fReset").onclick = () => { Object.assign(state, { lob: "", tsh: "", site: "", q: "", zero: false, sortCol: -1 }); setLevel(1); render(); };
  $("fCsv").onclick = () => downloadCsv(shown, val);
  document.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => { setLevel(+b.dataset.lvl); render(); });
  $("t5").onclick = e => {
    const tr = e.target.closest("tr[data-key]");
    if (tr) { const k = tr.dataset.key; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); return; }
    const th = e.target.closest("th[data-sort]");
    if (th) { const i = +th.dataset.sort; state.sortCol = (i < 0 || state.sortCol === i) ? -1 : i; render(); }
  };
}

function describeDefault() {
  const d = CONFIG.default_filter || {};
  return Object.entries(d).map(([k, v]) => `${FIELD_LABELS[k] || k} = ${v.join(" / ")}`).join(", ") || "no default filter";
}

function downloadCsv(list, val) {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [["LOB", "TSH", "Site Code", "Site Desc", ...TAB.columns.map(c => c.label)].map(q).join(",")];
  [...list].sort((a, b) => (a.lob + a.tsh + a.desc).localeCompare(b.lob + b.tsh + b.desc))
    .forEach(s => lines.push([s.lob, s.tsh, s.site, s.desc].map(q).concat([...val(s)].map(x => Math.round(x))).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = `focus_${TAB.id}${state.brand ? "_" + state.brand : ""}_R5_${(DATA.raw.data_date || "").replace(/\//g, "")}.csv`;
  a.click();
}

// ===== Screenshot (same method as Summit Samsung): render the page, as filtered, to PNG without libraries =====
function toast(msg, ms = 2500) {
  const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = "none"), ms);
}
function shotName() {
  const now = new Date(), p = n => String(n).padStart(2, "0");
  const scope = [state.brand, state.lob, state.tsh, state.site].filter(Boolean).join("_") || "All";
  return `Focus_${TAB.name}_${scope}_${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}.png`.replace(/[^\w.\-]+/g, "_");
}
function cloneWithStyles(src) {
  const dst = src.cloneNode(false);
  if (src.nodeType === 1) {
    const cs = getComputedStyle(src);
    for (let i = 0; i < cs.length; i++) dst.style.setProperty(cs[i], cs.getPropertyValue(cs[i]));
    if (src.tagName === "SELECT") {
      const span = document.createElement("span");
      for (let i = 0; i < cs.length; i++) span.style.setProperty(cs[i], cs.getPropertyValue(cs[i]));
      span.style.display = "inline-block"; span.style.overflow = "hidden"; span.style.whiteSpace = "nowrap";
      span.textContent = src.selectedOptions[0] ? src.selectedOptions[0].textContent : "";
      return span;
    }
    if (src.tagName === "INPUT") { dst.setAttribute("value", src.value); if (src.checked) dst.setAttribute("checked", ""); }
  }
  for (const c of src.childNodes) {
    if (c.nodeType === 1 && c.hasAttribute("data-noshot")) continue;
    if (c.nodeType === 8) continue;
    dst.appendChild(cloneWithStyles(c));
  }
  return dst;
}
async function renderShot() {
  const area = document.getElementById("shotArea");
  const clone = cloneWithStyles(area);
  clone.querySelectorAll(".scroll").forEach(e => { e.style.maxHeight = "none"; e.style.overflow = "visible"; });
  clone.querySelectorAll("th, tfoot td, header").forEach(e => { e.style.position = "static"; });
  clone.querySelectorAll("*").forEach(e => { e.style.backdropFilter = "none"; e.style.webkitBackdropFilter = "none"; });
  clone.style.margin = "0"; clone.style.minHeight = "0";
  const W = Math.ceil(Math.max(area.getBoundingClientRect().width, document.getElementById("main").scrollWidth));
  clone.style.width = W + "px";
  const holder = document.createElement("div");
  holder.style.cssText = "position:absolute;left:-100000px;top:0;";
  holder.appendChild(clone); document.body.appendChild(holder);
  const H = Math.ceil(clone.getBoundingClientRect().height);
  document.body.removeChild(holder);
  const bg = "linear-gradient(160deg,#f2f8fc 0%,#e1eef7 38%,#cfe3f1 72%,#bcd7ea 100%)";
  const xml = new XMLSerializer().serializeToString(clone);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="100%" height="100%">` +
              `<div xmlns="http://www.w3.org/1999/xhtml" style="background:${bg};width:${W}px;height:${H}px">${xml}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  await img.decode();
  const scale = 2, canvas = document.createElement("canvas");
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#e1eef7"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
  return new Promise((res, rej) => canvas.toBlob(b => (b ? res(b) : rej(new Error("toBlob failed"))), "image/png"));
}
async function takeShot(mode) {
  const btns = [document.getElementById("shotSave"), document.getElementById("shotCopy")];
  btns.forEach(b => (b.disabled = true)); toast("Capturing…", 10000);
  try {
    if (mode === "copy" && navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": renderShot() })]);
      toast("Image copied - paste it into WhatsApp / email (Ctrl+V)");
    } else {
      const blob = await renderShot();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = shotName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast(mode === "copy" ? "Copy isn't supported in this browser - saved as PNG instead" : "Saved " + a.download);
    }
  } catch (e) { console.error(e); toast("Screenshot failed: " + e.message, 5000); }
  finally { btns.forEach(b => (b.disabled = false)); }
}
