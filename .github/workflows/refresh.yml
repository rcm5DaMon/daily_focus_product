name: Refresh data

# Manual refresh: Actions tab -> "Refresh data" -> "Run workflow" (one BigQuery query, a few MB scanned).
# A push to main (e.g. you edit config/focus_products.json or index.html) only redeploys the site, no query.
# To refresh automatically, uncomment the schedule block. Cron is UTC: "0 3-14 * * *" = every hour 10:00-21:00 WIB.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 3-14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write      # lets the deploy job clear an old site package when a run is re-run

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet google-cloud-bigquery

      - name: Run import query
        run: python scripts/refresh.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Refresh data $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            git push
          fi

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html admin.html _site/
          cp -r assets config data _site/
      - uses: actions/configure-pages@v6
      # A re-run keeps the site package from the earlier attempt, and deploy-pages refuses when it finds two.
      # Delete any earlier "github-pages" package of this run first, then upload a fresh one.
      - name: Remove old site package (re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                       --jq '.artifacts[] | select(.name | startswith("github-pages")) | .id'); do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
