name: Refresh data

# Manual refresh: Actions tab -> "Refresh data" -> "Run workflow" (one BigQuery query, a few MB scanned).
# Publishing is done by GitHub Pages itself (Settings -> Pages -> "Deploy from a branch", main / root):
# every commit, including the data commit below, is published automatically by "pages build and deployment".
# To refresh automatically, uncomment the schedule block. Cron is UTC: "0 3-14 * * *" = every hour 10:00-21:00 WIB.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3-14 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet google-cloud-bigquery

      - name: Run import query
        run: python scripts/refresh.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Refresh data $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            git push
          fi
