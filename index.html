<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Daily Focus Product</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec; --soft:#f1f3f6;
    --accent:#1f2937; --hi:#fff7e0; --r5:#e8f1ff; --link:#2457c5;
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;position:sticky;top:0;z-index:5}
  .stamp{display:flex;gap:22px}
  .stamp b{display:block;font-size:20px;letter-spacing:.2px}
  .stamp span{color:var(--muted);font-size:12px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button{border:1px solid #9aa1ad;background:#fff;color:var(--ink);padding:8px 14px;font:600 12px system-ui;cursor:pointer;min-width:78px;border-radius:3px}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.3px;flex:1;min-width:240px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{font-size:11px;color:var(--muted);background:var(--soft);border-radius:20px;padding:3px 10px}
  .btn{font:600 12px system-ui;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:6px;text-decoration:none;cursor:pointer}
  .btn:hover{border-color:#9aa1ad}
  main{padding:18px 20px 40px;max-width:1500px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px}
  .card h2{margin:0 0 10px;font-size:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .card h2 small{font-weight:400;color:var(--muted)}
  .scroll{overflow:auto;max-height:70vh}
  table{border-collapse:collapse;width:max-content;min-width:100%}
  th,td{padding:5px 10px;border-bottom:1px solid var(--soft);white-space:nowrap}
  th{position:sticky;top:0;background:#fff;z-index:2;font-weight:600;text-align:right;border-bottom:2px solid var(--accent);cursor:pointer;user-select:none}
  th.l,td.l{text-align:left}
  td{text-align:right;font-variant-numeric:tabular-nums}
  td.tot,th.tot{border-right:1px solid #9cc0f5;font-weight:700}
  tr.r5 td{background:var(--r5)}
  tr.sub td{font-weight:700;background:var(--soft)}
  tr.lobsub td{font-weight:800;background:#e6e9ef}
  tr.grand td{font-weight:800;border-top:2px solid var(--accent);background:#fff}
  td.dim{color:#a0a6b2}
  .tg{border:0;background:none;cursor:pointer;font:700 12px monospace;color:var(--muted);padding:0 4px 0 0}
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
  .filters label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .filters select,.filters input[type=search]{font:13px system-ui;padding:6px 8px;border:1px solid var(--line);border-radius:5px;min-width:200px;background:#fff}
  .filters .chk{flex-direction:row;align-items:center;text-transform:none;font-weight:500;font-size:12px;color:var(--ink)}
  .msg{padding:40px;text-align:center;color:var(--muted)}
  .note{font-size:11px;color:var(--muted);margin-top:8px}
  th .arr{font-size:9px;color:var(--muted)}
  th .dr{border:1px solid #c5cad3;background:#fff;border-radius:3px;font:700 10px monospace;padding:0 3px;margin-left:4px;cursor:pointer;color:var(--ink)}
  th .dr:hover{border-color:var(--accent)}
  th.subc{background:#f7f9fc;font-weight:500;font-size:11px;color:#4a5263;border-bottom-color:#9aa1ad}
  td.subc{background:#fbfcfe;color:#4a5263}
  tr.sub td.subc,tr.lobsub td.subc,tr.grand td.subc{color:var(--ink)}
  th.par{background:#eef3fb}
  .bar{display:flex;gap:12px;align-items:flex-end;margin:0 0 14px;flex-wrap:wrap}
  .bar label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .bar select{font:13px system-ui;padding:6px 8px;border:1px solid var(--line);border-radius:5px;min-width:200px;background:#fff}
  @media (max-width:700px){h1{font-size:16px}.stamp b{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="stamp">
    <div><b id="lastDate">-</b><span>Last Update</span></div>
    <div><b id="lastTime">-</b><span>Last Time</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <h1 id="title">REPORT DAILY FOCUS PRODUCT</h1>
  <div class="tools" id="tools"></div>
</header>
<main id="main"><div class="msg">Loading…</div></main>

<script src="assets/engine.js"></script>
<script>
"use strict";
let DATA, CONFIG, TAB, VALS, SUB, BRANDS = [], isDraft = false;
const state = { brand: "", lob: "", tsh: "", site: "", q: "", zero: false, sortCol: -1, collapsed: new Set(), exp: new Set() };

(async function init() {
  try {
    const [raw, cfg] = await Promise.all([fetchJSON("data/daily.json"), loadConfig()]);
    DATA = parseData(raw);
    const d = new URLSearchParams(location.search).has("draft") ? draftConfig() : null;
    CONFIG = d || cfg; isDraft = !!d;
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="msg">Could not load data: ${esc(e.message)}<br>Run <b>Refresh data</b> once (GitHub Actions).</div>`;
    return;
  }
  document.getElementById("title").textContent = CONFIG.title || "REPORT DAILY FOCUS PRODUCT";
  document.getElementById("lastDate").textContent = fmtDate(DATA.raw.data_date);
  document.getElementById("lastTime").textContent = DATA.raw.last_time || "-";
  document.getElementById("tools").innerHTML =
    (isDraft ? `<span class="chip" style="background:#fff3c4;color:#7a5b00">Draft config preview (admin)</span>` : "") +
    `<span class="chip" title="When BigQuery was last queried">Imported ${esc((DATA.raw.refreshed_at || "").slice(0,16))} WIB</span>
     <a class="btn" target="_blank" rel="noopener" href="https://github.com/${GITHUB_REPO}/actions/workflows/refresh.yml">Refresh data ↗</a>
     <a class="btn" href="admin.html">Edit columns</a>`;
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CONFIG.tabs.map(t => `<button data-id="${esc(t.id)}">${esc(t.name)}</button>`).join("");
  tabsEl.onclick = e => { const b = e.target.closest("button"); if (b) location.hash = b.dataset.id; };
  window.addEventListener("hashchange", selectTab);
  selectTab();
})();

function selectTab() {
  const id = decodeURIComponent(location.hash.slice(1));
  TAB = CONFIG.tabs.find(t => t.id === id) || CONFIG.tabs[0];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === TAB.id));
  BRANDS = TAB.brand_filter ? tabBrands(DATA, CONFIG, TAB) : [];
  state.brand = ""; state.sortCol = -1; state.collapsed.clear(); state.exp.clear();
  recompute(); render();
}
function recompute() {
  const r = computeTab(DATA, CONFIG, TAB, { sub: true, brand: state.brand });
  VALS = r.vals; SUB = r.sub;
}

function sumInto(acc, v) { for (let i = 0; i < acc.length; i++) acc[i] += v[i]; }
const nonzero = v => v && v.some(x => x);
const drillName = () => DRILL_LABELS[TAB.drill || "model_type_detail"] || "detail";

function render() {
  const n = TAB.columns.length;
  const brandTxt = state.brand ? ` · brand ${esc(state.brand)}` : "";
  // ---------- Brand filter (tabs with brand_filter) ----------
  const brandBar = TAB.brand_filter ? `
    <div class="bar"><label>Brand<select id="fBrand"><option value="">All brands</option>${BRANDS.map(b => `<option${b === state.brand ? " selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
      <span class="note">Filters both tables. In the Region 5 table, click ⊞ on a column to split it by brand.</span></div>` : "";

  // ---------- Region table ----------
  const byRegion = new Map();
  for (const [site, v] of VALS) {
    if (!nonzero(v)) continue;
    const r = DATA.stores.get(site).region;
    if (!byRegion.has(r)) byRegion.set(r, new Float64Array(n));
    sumInto(byRegion.get(r), v);
  }
  const regions = [...byRegion.keys()].sort((a, b) => regionRank(a) - regionRank(b) || a.localeCompare(b));
  const gt = new Float64Array(n); regions.forEach(r => sumInto(gt, byRegion.get(r)));
  const head = TAB.columns.map(c => `<th class="${c.total ? "tot" : ""}">${esc(c.label)}</th>`).join("");
  const cells = v => TAB.columns.map((c, i) => `<td class="${c.total ? "tot" : ""}">${fmt(v[i])}</td>`).join("");
  const regionHTML = `
    <div class="card"><h2>Sales all region <small>${esc(TAB.name)}${brandTxt} · qty sold today</small></h2>
    <div class="scroll"><table>
      <thead><tr><th class="l">Region</th>${head}</tr></thead>
      <tbody>${regions.map(r => `<tr class="${r === "REGION 5" ? "r5" : ""}"><td class="l">${esc(r)}</td>${cells(byRegion.get(r))}</tr>`).join("")
        || `<tr><td class="l" colspan="${n + 1}">No sales yet today.</td></tr>`}
        <tr class="grand"><td class="l">Total</td>${cells(gt)}</tr></tbody>
    </table></div></div>`;

  // ---------- Region 5 table: stores ----------
  let r5 = [...DATA.stores.values()].filter(s => s.region === "REGION 5");
  r5 = r5.filter(s => nonzero(VALS.get(s.site)) || (state.zero && zeroSalesStore(CONFIG, s)));
  const lobs = [...new Set(r5.map(s => s.lob || "(no LOB)"))].sort();
  if (state.lob && !lobs.includes(state.lob)) state.lob = "";
  const r5a = r5.filter(s => !state.lob || (s.lob || "(no LOB)") === state.lob);
  const tshs = [...new Set(r5a.map(s => s.tsh || "(no TSH)"))].sort();
  if (state.tsh && !tshs.includes(state.tsh)) state.tsh = "";
  const r5b = r5a.filter(s => !state.tsh || (s.tsh || "(no TSH)") === state.tsh);
  const sites = [...r5b].sort((a, b) => a.desc.localeCompare(b.desc));
  if (state.site && !sites.some(s => s.site === state.site)) state.site = "";
  const q = state.q.trim().toUpperCase();
  const shown = r5b.filter(s => (!state.site || s.site === state.site) && (!q || s.desc.toUpperCase().includes(q) || s.site.toUpperCase().includes(q)));

  // ---------- Region 5 table: columns, with drill-down ----------
  // spec = list of displayed columns: {i, key:null} = the column itself, {i, key} = one drill value inside column i
  const spec = [];
  const subKeys = TAB.columns.map((c, i) => {
    const m = new Map();
    for (const s of shown) { const sr = SUB.get(s.site); if (sr) for (const [k, v] of sr[i]) m.set(k, (m.get(k) || 0) + v); }
    return [...m.entries()].filter(e => e[1]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(e => e[0]);
  });
  TAB.columns.forEach((c, i) => {
    spec.push({ i, key: null });
    if (state.exp.has(i)) subKeys[i].forEach(k => spec.push({ i, key: k }));
  });
  const zeroN = new Float64Array(spec.length);
  const vecCache = new Map();
  const vec = s => {
    let v = vecCache.get(s.site); if (v) return v;
    const base = VALS.get(s.site), sr = SUB.get(s.site);
    v = new Float64Array(spec.length);
    if (base) spec.forEach((c, j) => { v[j] = c.key === null ? base[c.i] : (sr[c.i].get(c.key) || 0); });
    vecCache.set(s.site, v); return v;
  };
  const cls = c => c.key !== null ? "subc" : (TAB.columns[c.i].total ? "tot" : "");
  const cells5 = v => spec.map((c, j) => `<td class="${cls(c)}">${fmt(v[j])}</td>`).join("");
  if (state.sortCol >= spec.length) state.sortCol = -1;
  const sc = state.sortCol;

  const opt = (vals, cur, all) => `<option value="">${all}</option>` + vals.map(v => `<option${v === cur ? " selected" : ""}>${esc(v)}</option>`).join("");
  const siteOpt = `<option value="">All</option>` + sites.map(s => `<option value="${esc(s.site)}"${s.site === state.site ? " selected" : ""}>${esc(s.desc)}</option>`).join("");

  // group LOB -> TSH -> sites
  const sortSites = arr => arr.sort(sc >= 0 ? (a, b) => vec(b)[sc] - vec(a)[sc] || a.desc.localeCompare(b.desc) : (a, b) => a.desc.localeCompare(b.desc));
  const tree = new Map();
  for (const s of shown) {
    const L = s.lob || "(no LOB)", T = s.tsh || "(no TSH)";
    if (!tree.has(L)) tree.set(L, new Map());
    if (!tree.get(L).has(T)) tree.get(L).set(T, []);
    tree.get(L).get(T).push(s);
  }
  let rows = "", grand = new Float64Array(spec.length);
  for (const L of [...tree.keys()].sort()) {
    const lobTot = new Float64Array(spec.length), lk = "L|" + L, lc = state.collapsed.has(lk);
    let lobRows = "";
    for (const T of [...tree.get(L).keys()].sort()) {
      const list = sortSites(tree.get(L).get(T)), tk = "T|" + L + "|" + T, tc = state.collapsed.has(tk);
      const tTot = new Float64Array(spec.length);
      list.forEach(s => sumInto(tTot, vec(s)));
      sumInto(lobTot, tTot);
      if (lc) continue;
      if (!tc) lobRows += list.map(s => `<tr><td class="l dim">${esc(L)}</td><td class="l dim">${esc(T)}</td><td class="l" title="${esc(s.site)}">${esc(s.desc)}</td>${cells5(vec(s))}</tr>`).join("");
      lobRows += `<tr class="sub"><td class="l dim">${esc(L)}</td><td class="l"><button class="tg" data-k="${esc(tk)}">${tc ? "⊞" : "⊟"}</button>${esc(T)}</td><td class="l">Total${tc ? ` <span class="dim">(${list.length} stores)</span>` : ""}</td>${cells5(tTot)}</tr>`;
    }
    sumInto(grand, lobTot);
    rows += lobRows + `<tr class="lobsub"><td class="l"><button class="tg" data-k="${esc(lk)}">${lc ? "⊞" : "⊟"}</button>${esc(L)}</td><td class="l">Total</td><td></td>${cells5(lobTot)}</tr>`;
  }
  const head5 = spec.map((c, j) => {
    const arr = `<span class="arr">${sc === j ? "▼" : ""}</span>`;
    if (c.key !== null) return `<th class="subc" data-sort="${j}" title="${esc(TAB.columns[c.i].label)} › ${esc(c.key)}">${esc(c.key)} ${arr}</th>`;
    const col = TAB.columns[c.i], open = state.exp.has(c.i), can = subKeys[c.i].length > 0;
    const btn = can ? `<button class="dr" data-dr="${c.i}" title="${open ? "Collapse" : "Drill down by " + esc(drillName())}">${open ? "−" : "+"}</button>` : "";
    return `<th class="${col.total ? "tot" : ""}${open ? " par" : ""}" data-sort="${j}" title="Sort stores by ${esc(col.label)}">${esc(col.label)}${btn} ${arr}</th>`;
  }).join("");
  const anyOpen = state.exp.size > 0;
  const zeroTxt = describeZero();
  const r5HTML = `
    <div class="card"><h2>Region 5 <small>${esc(TAB.name)}${brandTxt} · by LOB, TSH and store · ${shown.length} stores</small></h2>
      <div class="filters">
        <label>LOB<select id="fLob">${opt(lobs, state.lob, "All")}</select></label>
        <label>TSH<select id="fTsh">${opt(tshs, state.tsh, "All")}</select></label>
        <label>Site desc<select id="fSite">${siteOpt}</select></label>
        <label>Search store<input type="search" id="fQ" placeholder="name or site code" value="${esc(state.q)}"></label>
        <label class="chk" title="${esc(zeroTxt)}"><input type="checkbox" id="fZero"${state.zero ? " checked" : ""}>&nbsp;Show ${esc(zeroTxt)} with no sales</label>
        <button class="btn" id="fExp">${anyOpen ? "Collapse all columns" : "Drill down all columns"}</button>
        <button class="btn" id="fReset">Reset</button>
        <button class="btn" id="fCsv">Download CSV</button>
      </div>
      <div class="scroll"><table id="t5">
        <thead><tr><th class="l" data-sort="-1">LOB</th><th class="l" data-sort="-1">TSH</th><th class="l" data-sort="-1">SITE DESC</th>${head5}</tr></thead>
        <tbody>${rows || `<tr><td class="l" colspan="${spec.length + 3}">No Region 5 sales for this selection.</td></tr>`}
          <tr class="grand"><td class="l">Total</td><td></td><td></td>${cells5(grand)}</tr></tbody>
      </table></div>
      <div class="note">Qty = PAID, ${esc(describeDefault())}. Click <b>+</b> on a column header to drill it down by ${esc(drillName().toLowerCase())} (shaded columns), <b>−</b> to close.
        Click a header to sort stores by it, click ⊟ to collapse a LOB or TSH.</div>
    </div>`;

  document.getElementById("main").innerHTML = brandBar + regionHTML + r5HTML;
  const $ = id => document.getElementById(id);
  if ($("fBrand")) $("fBrand").onchange = e => { state.brand = e.target.value; state.sortCol = -1; recompute(); render(); };
  $("fLob").onchange = e => { state.lob = e.target.value; state.tsh = ""; state.site = ""; render(); };
  $("fTsh").onchange = e => { state.tsh = e.target.value; state.site = ""; render(); };
  $("fSite").onchange = e => { state.site = e.target.value; render(); };
  $("fQ").oninput = e => { state.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { render(); const el = $("fQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  $("fZero").onchange = e => { state.zero = e.target.checked; render(); };
  $("fExp").onclick = () => { if (anyOpen) state.exp.clear(); else TAB.columns.forEach((c, i) => state.exp.add(i)); state.sortCol = -1; render(); };
  $("fReset").onclick = () => { Object.assign(state, { lob: "", tsh: "", site: "", q: "", zero: false, sortCol: -1 }); state.collapsed.clear(); state.exp.clear(); render(); };
  $("fCsv").onclick = () => downloadCsv(shown, vec, spec);
  $("t5").onclick = e => {
    const d = e.target.closest(".dr");
    if (d) { const i = +d.dataset.dr; state.exp.has(i) ? state.exp.delete(i) : state.exp.add(i); state.sortCol = -1; render(); return; }
    const b = e.target.closest(".tg");
    if (b) { const k = b.dataset.k; state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); render(); return; }
    const th = e.target.closest("th[data-sort]");
    if (th) { const i = +th.dataset.sort; state.sortCol = state.sortCol === i ? -1 : i; render(); }
  };
}

function describeDefault() {
  const d = CONFIG.default_filter || {};
  return Object.entries(d).map(([k, v]) => `${FIELD_LABELS[k] || k} = ${v.join(" / ")}`).join(", ") || "no default filter";
}
function describeZero() {
  const r = CONFIG.zero_sales_store_filter || { status: ["Active"] };
  const st = (r.status || []).join("/"), bu = (r.bu_category || []).join("/");
  return [st && st.toLowerCase(), bu, "stores"].filter(Boolean).join(" ");
}

function downloadCsv(list, vec, spec) {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const names = spec.map(c => c.key === null ? TAB.columns[c.i].label : TAB.columns[c.i].label + " > " + c.key);
  const lines = [["LOB", "TSH", "Site Code", "Site Desc", ...names].map(q).join(",")];
  [...list].sort((a, b) => (a.lob + a.tsh + a.desc).localeCompare(b.lob + b.tsh + b.desc))
    .forEach(s => lines.push([s.lob, s.tsh, s.site, s.desc].map(q).concat([...vec(s)].map(x => Math.round(x))).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = `focus_${TAB.id}${state.brand ? "_" + state.brand : ""}_R5_${(DATA.raw.data_date || "").replace(/\//g, "")}.csv`;
  a.click();
}
</script>
</body>
</html>
